<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 | 卡林托油墨</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.ico" sizes="any">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #1f332b;
            color: #fffaf2;
            font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
        }

        .not-found {
            width: min(720px, calc(100% - 48px));
            padding: 80px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 54px;
            color: #fffaf2;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
        }

        .brand img {
            width: 64px;
            height: 48px;
            object-fit: contain;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: rgba(255, 250, 242, 0.62);
            font-size: 14px;
            font-weight: 700;
        }

        h1 {
            margin: 0;
            font-family: "Noto Serif SC", SimSun, serif;
            font-size: clamp(42px, 8vw, 76px);
            font-weight: 400;
            line-height: 1.08;
        }

        p {
            max-width: 560px;
            margin: 24px 0 0;
            color: rgba(255, 250, 242, 0.74);
            font-size: 18px;
            line-height: 1.8;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 42px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 22px;
            border: 1px solid #fffaf2;
            color: #1f332b;
            background: #fffaf2;
            text-decoration: none;
            font-size: 15px;
        }

        .button.secondary {
            color: #fffaf2;
            background: transparent;
        }

        @media (max-width: 620px) {
            .not-found {
                width: min(100% - 52px, 720px);
            }

            .brand {
                font-size: 20px;
            }

            .brand img {
                width: 50px;
                height: 38px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <main class="not-found">
        <a class="brand" href="index.html" aria-label="返回卡林托油墨首页">
            <img src="images/qinglongcao-mark-white.png" alt="青龙草油墨商标">
            <span>青龙草油墨</span>
        </a>
        <p class="eyebrow">404</p>
        <h1>页面没有找到。</h1>
        <p>可能是链接已调整，或访问地址输入有误。您可以返回首页查看产品体系，也可以直接进入联系咨询。</p>
        <div class="actions">
            <a class="button" href="index.html">返回首页</a>
            <a class="button secondary" href="index.html#contact">联系咨询</a>
        </div>
    </main>
</body>
</html>
